services:
  http-server-projeto-korp:
    build:
      context: ./app
    container_name: http-server-projeto-korp
    networks:
      - http-server-projeto-korp-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/http-server-projeto-korp.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - http-server-projeto-korp
    networks:
      - http-server-projeto-korp-network

networks:
  http-server-projeto-korp-network:
    external: true